<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#fcfbf8" />
        <meta name="description" content="Waysider. Software off the main road." />
        <title>Waysider — Software off the main road</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <style>
            :root {
                color-scheme: light;
                --paper: #fcfbf8;
                --ink: #272b27;
                --muted: #696d65;
                --line: #e4e3dc;
                --accent: #974932;
                --green: #244e3b;
                --green-soft: #f0f3ec;
                font-family: "DM Sans", Arial, sans-serif;
                color: var(--ink);
                background: var(--paper);
                -webkit-font-smoothing: antialiased;
            }

            * { box-sizing: border-box; }
            html { scroll-behavior: smooth; }
            body { margin: 0; min-width: 320px; }
            a { color: inherit; }
            a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
            svg { display: block; }
            h1, h2, p { margin-top: 0; }
            .page { width: min(100% - 80px, 1040px); margin-inline: auto; }
            .mono { font-family: "DM Mono", ui-monospace, monospace; }

            .site-header {
                min-height: 100px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                border-bottom: 1px solid var(--line);
            }
            .wordmark {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -.06em;
                text-decoration: none;
            }
            .brand-mark { width: 26px; height: 29px; color: var(--accent); }
            .arrow { width: 15px; height: 15px; flex: none; }

            .hero {
                display: grid;
                grid-template-columns: 1.35fr 1fr;
                align-items: center;
                gap: 32px;
                padding-block: 94px 100px;
            }
            h1 { margin-bottom: 26px; font-size: clamp(64px, 6.5vw, 88px); font-weight: 600; letter-spacing: -.065em; line-height: 1.03; }
            h1 span { color: var(--accent); }
            .road-doodle { width: min(100%, 340px); margin: 42px auto 0; color: var(--accent); transform: rotate(-3deg); }
            .doodle-caption { fill: currentColor; stroke: none; font-family: "Comic Sans MS", "Chalkboard SE", cursive; font-size: 16px; letter-spacing: .01em; }

            .projects { padding-block: 32px 64px; border-top: 1px solid var(--line); }
            .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
            .section-heading h2 { margin: 0; font-size: 11px; font-weight: 400; line-height: 1.6; letter-spacing: .09em; text-transform: uppercase; }
            .project-count { color: var(--muted); font-size: 10px; }
            .project {
                display: grid;
                grid-template-columns: 1fr 220px;
                align-items: center;
                gap: 32px;
                padding: 36px 40px 32px;
                border: 1px solid #dce3d6;
                background: var(--green-soft);
                color: var(--green);
                text-decoration: none;
                transition: background 180ms ease, border-color 180ms ease;
            }
            .project:hover { background: #e9efe3; border-color: #acbda5; }
            .project-meta { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
            .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
            .project h3 { margin: 0 0 10px; font-size: clamp(32px, 4vw, 43px); font-weight: 600; line-height: 1.15; letter-spacing: -.055em; }
            .project-description { margin-bottom: 26px; color: #5b6b5d; font-size: 15px; line-height: 1.7; }
            .project-link { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
            .project:hover .project-link { text-decoration: underline; text-underline-offset: 5px; }
            .project-link .arrow { transition: transform 180ms ease; }
            .project:hover .project-link .arrow { transform: translate(2px, -2px); }
            .garden-doodle { width: 120px; height: 150px; margin: auto; color: #53735a; transform: rotate(5deg); }

            .site-footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 25px 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 1.8; }
            .site-footer p { margin: 0; }
            .footer-email { text-decoration: none; }

            @media (min-width: 1500px) { .hero { padding-block: 116px 120px; } }
            @media (max-width: 760px) {
                .page { width: calc(100% - 48px); }
                .site-header { min-height: 82px; }
                .hero { grid-template-columns: 1fr; gap: 22px; padding-block: 64px 42px; }
                h1 { font-size: clamp(55px, 10.5vw, 78px); }
                .road-doodle { width: 235px; margin: 0 12px 0 auto; }
                .project { grid-template-columns: 1fr 100px; gap: 16px; padding: 28px; }
                .garden-doodle { width: 90px; height: 120px; }
                .projects { padding-bottom: 40px; }
            }
            @media (max-width: 420px) {
                .page { width: calc(100% - 40px); }
                .wordmark { font-size: 22px; }
                .project { grid-template-columns: 1fr; position: relative; padding: 25px; }
                .project-copy { position: relative; z-index: 1; }
                .garden-doodle { position: absolute; width: 61px; height: 80px; right: 23px; top: 9px; }
                .site-footer { align-items: flex-start; flex-direction: column; gap: 9px; }
            }
            @media (prefers-reduced-motion: reduce) {
                html { scroll-behavior: auto; }
                *, *::before, *::after { transition: none !important; }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <a class="wordmark" href="/" aria-label="Waysider home">
                    <svg class="brand-mark" viewBox="0 0 30 32" fill="none" aria-hidden="true">
                        <path d="m3 6 6 20 6-13 6 13 6-20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>waysider</span>
                </a>
            </header>

            <main>
                <section class="hero" aria-labelledby="hero-title">
                    <div class="hero-copy">
                        <h1 id="hero-title">Software<br />off the<br /><span>main road.</span></h1>
                    </div>
                    <svg class="road-doodle" viewBox="0 0 340 310" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <!-- A slightly wonky sign and a road that takes its time. -->
                        <path d="M74 291c-11-36 10-59 49-72 42-14 78-18 82-40 4-19-30-25-37-44-6-18 7-34 17-44" />
                        <path d="M112 294c-15-31 8-43 38-55 40-16 79-23 86-53 7-32-33-41-40-55-6-11 0-24 7-37" />
                        <path d="m92 276 1-12m14-16 10-6m19-8 13-5m19-6 12-4m18-7 10-6m12-15 2-10m-6-17-8-7m-14-15-5-9m-2-17 3-9" stroke-width="1.3" />
                        <path d="m236 172-4-98 5-1 6 97m-10 1 15-2" />
                        <path d="m212 79 60-5 15 13-13 13-60 2Z" fill="var(--paper)" />
                        <path d="m244 88 25-1m-7-5 7 5-7 5" />
                        <path d="m62 211 4-12 4 12m-5-3-6-5m7 4 9-5m181 20 5-12 4 12m-4-5 8-5" stroke-width="1.4" />
                        <path d="M60 221c8-3 16-3 24-2m166 15 19-2M278 178l9 2m-241 84 13-2m103 24 10 1" stroke-width="1.3" />
                        <path d="M91 76c-5-8-1-17 7-19 10-3 19 4 18 12-1 10-17 15-25 7Zm9-32 1-8m25 18 7-5m-7 28 8 4M82 52l-6-6m6 34-7 5" stroke-width="1.5" />
                        <path d="M160 50c6-10 13-9 17-3 7-10 16-8 21-1" stroke-width="1.3" />
                    </svg>
                </section>

                <section class="projects" aria-labelledby="projects-title">
                    <div class="section-heading">
                        <h2 class="mono" id="projects-title">Out in the world</h2>
                        <span class="project-count mono">01 / one and counting</span>
                    </div>
                    <a class="project" href="https://release.garden" target="_blank" rel="noopener" aria-label="Visit release.garden (opens in a new tab)">
                        <div class="project-copy">
                            <div class="project-meta mono"><span class="status-dot" aria-hidden="true"></span>Live <span aria-hidden="true">·</span> Est. 2026</div>
                            <h3>release.garden</h3>
                            <p class="project-description">A home for your releases.</p>
                            <span class="project-link">Visit release.garden
                                <svg class="arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 13 10-10M4 3h9v9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            </span>
                        </div>
                        <svg class="garden-doodle" viewBox="0 0 120 150" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M58 103c-4-21-2-47 3-70m-4 42C37 73 22 59 22 41c23 2 35 15 35 34Zm1 13c0-21 16-37 37-40-1 22-15 36-37 40Zm4-46c-7-12-4-25 9-34 7 14 4 25-9 34Z" />
                            <path d="m31 50 26 25m1 13 27-29M63 40l5-18" stroke-width="1.1" />
                            <path d="m36 100 48-1-8 36-29 1Z" />
                            <path d="m36 108 46-1m-58 34c22-4 52-4 72-1" stroke-width="1.3" />
                            <path d="m15 26-5-4m39-12-1-7m40 31 6-3m-76 85-5 1m91 4 5-2" stroke-width="1.2" />
                        </svg>
                    </a>
                </section>
            </main>

            <footer class="site-footer mono">
                <p>© 2026 Waysider. A little off the beaten path.</p>
                <a class="footer-email" href="mailto:hello@waysider.space">Say hello!</a>
            </footer>
        </div>
    </body>
</html>
